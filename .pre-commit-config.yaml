repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # ruff 0.17 also formats Python code blocks in Markdown by default; keep Python only.
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: mkdocs-build
        name: mkdocs build --strict
        language: system
        entry: .venv/bin/mkdocs build --strict --quiet
        files: ^(docs/.*\.md|mkdocs\.yml)$
        pass_filenames: false
